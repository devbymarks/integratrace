server:
  port: 8080
spring:
  application:
    name: integratrace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/integratrace}
    username: ${SPRING_DATASOURCE_USERNAME:integratrace}
    password: ${SPRING_DATASOURCE_PASSWORD:integratrace_local_only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
